name: Signed updater macOS release
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version increase on main
        id: version
        run: python3 scripts/release_version.py
  release:
    needs: detect
    if: needs.detect.outputs.eligible == 'true'
    permissions:
      contents: write
    concurrency:
      group: fershot-version-release
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      UPDATER_RELEASE_REF: ${{ vars.UPDATER_RELEASE_REF }}
      RELEASE_OWNER: ${{ vars.UPDATER_RELEASE_OWNER || github.repository_owner }}
      RELEASE_REPO: ${{ vars.UPDATER_RELEASE_REPO || github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard published versions and immutable tags
        id: release_guard
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.UPDATER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const guard = require('./scripts/release_gate.cjs');
            await guard({github, context, core, env: process.env});
      - name: Require real updater signing configuration
        if: steps.release_guard.outputs.publish == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('TAURI_SIGNING_PRIVATE_KEY'):
              raise SystemExit('Missing TAURI_SIGNING_PRIVATE_KEY release secret')
          PY
          python3 scripts/configure_updater.py --repository "$RELEASE_OWNER/$RELEASE_REPO"
      - name: Import and validate macOS signing certificate
        if: steps.release_guard.outputs.publish == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 scripts/macos_signing.py prepare
      - uses: actions/setup-node@v4
        if: steps.release_guard.outputs.publish == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_guard.outputs.publish == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust dependencies and build outputs
        if: steps.release_guard.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-release-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: macos-release-${{ runner.arch }}-
      - name: Install frozen frontend dependencies
        if: steps.release_guard.outputs.publish == 'true'
        run: npm ci
      - name: Verify version and fast regressions
        if: steps.release_guard.outputs.publish == 'true'
        run: |
          npm run version:check
          node --input-type=module -e 'import fs from "node:fs";if(process.env.RELEASE_TAG!==`v${JSON.parse(fs.readFileSync("package.json")).version}`)throw Error("Release version must match package.json")'
          python3 -m unittest discover -s scripts -p test_configure_updater.py
          python3 -m unittest discover -s scripts -p test_release_version.py
          node --test scripts/release_gate.test.cjs
          python3 -m unittest discover -s scripts -p test_macos_signing.py
          python3 scripts/test_verify_update_manifest.py
          npm run test:unit
          cargo test --locked --manifest-path src-tauri/crates/scroll-core/Cargo.toml
      - name: Build and upload Apple Silicon
        uses: tauri-apps/tauri-action@v1
        if: steps.release_guard.outputs.publish == 'true'
        id: tauri_arm
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: -D warnings
        with:
          owner: ${{ env.RELEASE_OWNER }}
          repo: ${{ env.RELEASE_REPO }}
          releaseCommitish: ${{ vars.UPDATER_RELEASE_REF || github.sha }}
          tagName: v__VERSION__
          releaseName: FerShot X v__VERSION__
          releaseBody: 'Choose aarch64 for Apple Silicon (M-series) or x64 for Intel. Verification candidate; manual acceptance pending. Tauri-signed updates; macOS identity follows release configuration; not notarized. Source commit: ${{ github.sha }}. See docs/releases.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.generated.json
      - name: Build and upload Intel
        uses: tauri-apps/tauri-action@v1
        if: steps.release_guard.outputs.publish == 'true'
        id: tauri_intel
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: -D warnings
        with:
          owner: ${{ env.RELEASE_OWNER }}
          repo: ${{ env.RELEASE_REPO }}
          releaseCommitish: ${{ vars.UPDATER_RELEASE_REF || github.sha }}
          releaseId: ${{ steps.tauri_arm.outputs.releaseId }}
          tagName: v__VERSION__
          releaseName: FerShot X v__VERSION__
          releaseBody: 'Choose aarch64 for Apple Silicon (M-series) or x64 for Intel. Verification candidate; manual acceptance pending. Tauri-signed updates; macOS identity follows release configuration; not notarized. Source commit: ${{ github.sha }}. See docs/releases.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.generated.json
      - name: Verify both architecture-specific app certificates
        if: steps.release_guard.outputs.publish == 'true'
        run: |
          python3 scripts/macos_signing.py verify --architecture arm64 --app "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/FerShot X.app"
          python3 scripts/macos_signing.py verify --architecture x86_64 --app "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/FerShot X.app"
      - name: Verify complete updater manifest before publishing
        if: steps.release_guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPDATER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri_arm.outputs.releaseId }}
        run: |
          brew install minisign
          mkdir -p artifacts/release-check
          gh release download "$RELEASE_TAG" --repo "$RELEASE_OWNER/$RELEASE_REPO" --pattern latest.json --pattern '*.app.tar.gz' --dir artifacts/release-check
          gh api "repos/$RELEASE_OWNER/$RELEASE_REPO/releases/$RELEASE_ID" > artifacts/release-check/release.json
          python3 scripts/verify_update_manifest.py artifacts/release-check/latest.json --tag "$RELEASE_TAG" --repository "$RELEASE_OWNER/$RELEASE_REPO" --assets-dir artifacts/release-check --public-key-config src-tauri/tauri.updater.generated.json --release-metadata artifacts/release-check/release.json --require-split
          python3 scripts/macos_signing.py verify-archives --assets artifacts/release-check --manifest artifacts/release-check/latest.json
          gh release upload "$RELEASE_TAG" artifacts/release-check/latest.json --repo "$RELEASE_OWNER/$RELEASE_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_OWNER/$RELEASE_REPO" --draft=false --latest
      - name: Clean up temporary signing keychain
        if: always() && env.FERSHOT_SIGNING_STATE != ''
        run: python3 scripts/macos_signing.py cleanup
