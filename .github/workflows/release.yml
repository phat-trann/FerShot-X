name: Signed updater macOS release
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version increase on main
        id: version
        run: python3 scripts/release_version.py
  release:
    needs: detect
    if: needs.detect.outputs.eligible == 'true'
    permissions:
      contents: write
    concurrency:
      group: fershot-version-release
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY || '-' }}
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      UPDATER_RELEASE_REF: ${{ vars.UPDATER_RELEASE_REF }}
      RELEASE_OWNER: ${{ vars.UPDATER_RELEASE_OWNER || github.repository_owner }}
      RELEASE_REPO: ${{ vars.UPDATER_RELEASE_REPO || github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard published versions and immutable tags
        id: release_guard
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.UPDATER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const guard = require('./scripts/release_gate.cjs');
            await guard({github, context, core, env: process.env});
      - uses: actions/setup-node@v4
        if: steps.release_guard.outputs.publish == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_guard.outputs.publish == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install frozen frontend dependencies
        if: steps.release_guard.outputs.publish == 'true'
        run: npm ci
      - name: Verify version and test
        if: steps.release_guard.outputs.publish == 'true'
        run: |
          npm run version:check
          node --input-type=module -e 'import fs from "node:fs";if(process.env.RELEASE_TAG!==`v${JSON.parse(fs.readFileSync("package.json")).version}`)throw Error("Release version must match package.json")'
          python3 -m unittest discover -s scripts -p test_configure_updater.py
          python3 -m unittest discover -s scripts -p test_release_version.py
          node --test scripts/release_gate.test.cjs
          npm run typecheck
          python3 scripts/test_verify_update_manifest.py
          npm run test:unit
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          cargo rustc --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
          cargo test --locked --manifest-path src-tauri/crates/scroll-core/Cargo.toml
      - name: Require real updater signing configuration
        if: steps.release_guard.outputs.publish == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('TAURI_SIGNING_PRIVATE_KEY'):
              raise SystemExit('Missing TAURI_SIGNING_PRIVATE_KEY release secret')
          PY
          python3 scripts/configure_updater.py --repository "$RELEASE_OWNER/$RELEASE_REPO"
      - name: Provide certificate only for explicitly configured stable app signing
        if: steps.release_guard.outputs.publish == 'true' && env.APPLE_SIGNING_IDENTITY != '-'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: python
        run: |
          import os, uuid
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name in ('APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD'):
                  value = os.environ[name]
                  delimiter = 'FERSHOT_' + uuid.uuid4().hex
                  while delimiter in value:
                      delimiter = 'FERSHOT_' + uuid.uuid4().hex
                  output.write(name + '<<' + delimiter + '\n' + value + '\n' + delimiter + '\n')
      - uses: tauri-apps/tauri-action@v1
        if: steps.release_guard.outputs.publish == 'true'
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ env.RELEASE_OWNER }}
          repo: ${{ env.RELEASE_REPO }}
          releaseCommitish: ${{ vars.UPDATER_RELEASE_REF || github.sha }}
          tagName: v__VERSION__
          releaseName: FerShot X v__VERSION__
          releaseBody: 'Verification candidate; manual acceptance pending. Tauri-signed updates; macOS identity follows release configuration; not notarized. Source commit: ${{ github.sha }}. See docs/releases.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.generated.json
      - name: Verify complete updater manifest before publishing
        if: steps.release_guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPDATER_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          brew install minisign
          mkdir -p artifacts/release-check
          gh release download "$RELEASE_TAG" --repo "$RELEASE_OWNER/$RELEASE_REPO" --pattern latest.json --pattern '*.app.tar.gz' --dir artifacts/release-check
          gh api "repos/$RELEASE_OWNER/$RELEASE_REPO/releases/$RELEASE_ID" > artifacts/release-check/release.json
          python3 scripts/verify_update_manifest.py artifacts/release-check/latest.json --tag "$RELEASE_TAG" --repository "$RELEASE_OWNER/$RELEASE_REPO" --assets-dir artifacts/release-check --public-key-config src-tauri/tauri.updater.generated.json --release-metadata artifacts/release-check/release.json
          gh release upload "$RELEASE_TAG" artifacts/release-check/latest.json --repo "$RELEASE_OWNER/$RELEASE_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_OWNER/$RELEASE_REPO" --draft=false --latest
